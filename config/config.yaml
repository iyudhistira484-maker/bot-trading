market:
  pairs: [BTC/IDR]
  timeframe: 1h
  ohlcv_limit: 500
  timeout_ms: 15000
  retries: 3
  retry_delay_seconds: 1.0
strategy:
  ema_fast: 20
  ema_slow: 50
  ema_trend: 200
  rsi_period: 14
  rsi_min: 50.0
  rsi_max: 70.0
  atr_period: 14
  atr_min: 0.0
  atr_stop_multiplier: 2.0
  risk_reward: 2.0
risk:
  risk_per_trade: 0.01
  daily_loss_limit: 0.03
  max_drawdown: 0.10
  max_capital_idr: 10000000.0
execution:
  live_enabled: false
  # Paper example: IDR Pro fee table shown by user on 2026-11-23.
  # Fee fields = service fee + CFX; tax is separate. Verify current rates.
  maker_buy_fee_rate: 0.0010555
  maker_sell_fee_rate: 0.0010555
  taker_buy_fee_rate: 0.0020555
  taker_sell_fee_rate: 0.0020555
  buy_tax_rate: 0.0
  sell_tax_rate: 0.0021
  slippage_rate: 0.001
  max_spread_rate: 0.02
  max_price_deviation_rate: 0.02
  max_quote_age_seconds: 30
  max_candle_age_intervals: 2
  # Paper-only assumption: IDR Pro minimum per public help page; the API's
  # own minimum is not verified. This may reject small virtual exits too.
  min_notional_idr:
    BTC/IDR: 25000.0
backtest:
  initial_equity_idr: 10000000.0
  in_sample_fraction: 0.7
  overfit_return_ratio: 0.5
runtime:
  paper_database: data/paper.sqlite
  poll_interval_seconds: 15
  entry_window_seconds: 60
  heartbeat_seconds: 3600
  telegram_poll_limit: 20
  log_file: logs/bot.jsonl
  log_max_bytes: 5000000
  log_backup_count: 3
